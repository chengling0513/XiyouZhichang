<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>职场西游世界，测测你是谁？</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23C0392B'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%23FFF' font-family='serif'%3E%E8%A5%BF%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F1E7;
  --bg-2:#EFE7D6;
  --card:#FFFDF7;
  --ink:#2A2622;
  --ink-2:#5C544A;
  --ink-3:#8A8072;
  --red:#C0392B;
  --red-2:#A32E22;
  --gold:#C9A063;
  --gold-2:#B08A48;
  --line:#E3D8C2;
  --shadow:0 6px 18px rgba(74,55,32,.10);
  --shadow-2:0 10px 28px rgba(74,55,32,.16);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;line-height:1.6}
body{min-height:100vh}
#app{max-width:720px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.view{display:none;min-height:100vh;padding:20px 18px 40px;animation:fadeIn .35s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;font-size:16px;font-weight:600;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;text-align:center}
.btn-primary{background:var(--red);color:#FFF;box-shadow:0 6px 16px rgba(192,57,43,.28)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,#D8B373,#B08A48);color:#fff;box-shadow:0 6px 16px rgba(176,138,72,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
/* toast */
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:rgba(42,38,34,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 开场页 ===== */
#view-home{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;position:relative}
#view-home.active{display:flex}
.cloud{position:absolute;font-size:42px;opacity:.85;animation:floatCloud 6s ease-in-out infinite}
.cloud.c1{top:12%;left:-60px;animation-delay:0s}
.cloud.c2{top:22%;right:-60px;animation-delay:1.5s}
.cloud.c3{bottom:18%;left:-50px;animation-delay:3s}
@keyframes floatCloud{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}
.scroll{width:140px;height:140px;margin-bottom:10px;animation:openScroll 1.2s ease both}
@keyframes openScroll{from{transform:scaleY(.2);opacity:0}to{transform:scaleY(1);opacity:1}}
.title{font-size:34px;font-weight:800;letter-spacing:2px;margin:8px 0 6px;line-height:1.25}
.title .ch{display:inline-block;opacity:0;animation:riseIn .5s ease forwards}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.subtitle{font-size:16px;color:var(--ink-2);margin-bottom:18px}
.meta{display:flex;gap:14px;font-size:13px;color:var(--ink-3);margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.meta span{background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.home-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.home-actions .btn{width:100%}
.sound-fab{position:absolute;right:16px;bottom:16px}
.home-chars{display:flex;justify-content:center;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
.home-chars .hc{width:52px;height:52px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:hidden;animation:breath 3s ease-in-out infinite}
.home-chars .hc:nth-child(2n){animation-delay:.4s}
.home-chars .hc:nth-child(3n){animation-delay:.8s}
.home-chars .hc:nth-child(5n){animation-delay:1.2s}
.quiz-mascot{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.quiz-mascot .qm-ava{width:44px;height:44px;flex-shrink:0}
.quiz-mascot .qm-text{font-size:12px;color:var(--ink-3);line-height:1.4}
.quiz-mascot .qm-text b{color:var(--red);font-size:13px}
.past-result-btn{margin-top:10px;width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#F5E6C8,#E8D09A);border:1.5px solid var(--gold);color:var(--ink);font-size:14px;font-weight:600;text-align:center}
/* ===== 测评页 ===== */
.progress-wrap{margin:6px 0 18px}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.progress-bar{height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:999px;transition:width .35s ease}
.q-card{background:var(--card);border-radius:var(--radius);padding:22px 18px;box-shadow:var(--shadow);margin-bottom:16px;position:relative}
.q-num{font-size:12px;color:var(--gold-2);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:18px;font-weight:700;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;text-align:left;transition:transform .28s ease,background .2s ease,border-color .2s ease;box-shadow:0 2px 6px rgba(74,55,32,.05)}
.opt .key{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--bg-2);color:var(--ink-2);font-size:13px;align-items:center;justify-content:center;margin-right:8px;font-weight:700}
.opt.selected{background:#FDECEA;border-color:var(--red);transform:scale(1.02)}
.opt.selected .key{background:var(--red);color:#fff}
.quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.quiz-nav .btn{flex:1}
.q-slide{animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.q-slide.back{animation:slideInBack .3s ease}
@keyframes slideInBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.locked{pointer-events:none;opacity:.7}
/* ===== 结果页 ===== */
#view-result .hero{background:linear-gradient(160deg,#FFFDF7,#F3E8CF);border-radius:var(--radius);padding:24px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.char-stage{width:200px;height:200px;margin:0 auto 8px;position:relative}
.char-stage svg,.char-stage .fallback{width:100%;height:100%}
.fallback{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:78px;animation:breathe 3s ease-in-out infinite}
.fallback.g1{background:radial-gradient(circle at 30% 30%,#F5D9A8,#C9A063)}
.fallback.g2{background:radial-gradient(circle at 30% 30%,#F8C8C0,#C0392B)}
.fallback.g3{background:radial-gradient(circle at 30% 30%,#CBE2D8,#5E8B7A)}
.fallback.g4{background:radial-gradient(circle at 30% 30%,#D8D0F0,#7A6FA8)}
.fallback.g5{background:radial-gradient(circle at 30% 30%,#F0D8B8,#A87B4A)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.r-name{font-size:28px;font-weight:800;margin:4px 0 2px}
.r-tag{font-size:15px;color:var(--red);font-weight:600}
.r-arch{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.r-sim{font-size:14px;background:var(--bg-2);display:inline-block;padding:4px 14px;border-radius:999px;color:var(--ink-2)}
.sub-role-chip{position:absolute;right:14px;top:14px;background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-2)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:15px;color:var(--gold-2);margin-bottom:10px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px}
.strengths li,.blindspots li{font-size:14px;margin:6px 0 6px 18px;color:var(--ink-2)}
.badge89{background:linear-gradient(135deg,#C0392B,#8E2A1F);color:#FFF;padding:12px 14px;border-radius:12px;font-size:14px;margin-top:8px}
.partner{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.partner:last-child{border-bottom:none}
.partner .p-ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.partner .p-name{font-size:14px;font-weight:700}
.partner .p-reason{font-size:12px;color:var(--ink-3)}
.mini-roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mini-role{background:var(--bg-2);border-radius:12px;padding:10px 6px;text-align:center}
.mini-role .m-ava{width:56px;height:56px;margin:0 auto 4px}
.mini-role .m-name{font-size:12px;font-weight:700;margin-top:2px}
.mini-role .m-sim{font-size:11px;color:var(--ink-3)}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.result-actions .btn{font-size:14px;padding:12px 8px}
.result-actions .full{grid-column:1/-1}
.debug-box{background:#2A2622;color:#E8DFCE;border-radius:12px;padding:14px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin-top:10px;line-height:1.5}
/* ===== 图鉴页 ===== */
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.filter-bar button{flex-shrink:0;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.filter-bar button.active{background:var(--red);color:#fff;border-color:var(--red)}
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g-card{background:var(--card);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.g-card:active{transform:scale(.97)}
.g-card .g-ava{width:80px;height:80px;margin:0 auto 6px}
.g-card .g-name{font-size:15px;font-weight:700}
.g-card .g-tag{font-size:11px;color:var(--ink-3)}
.back-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
/* SVG common */
.breath{transform-origin:center;animation:breath 3s ease-in-out infinite}
.eyeblink{animation:blink 4s ease-in-out infinite;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes rotateSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes driftX{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes sashFlow{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes spinWheel{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.tangsun-halo{transform-origin:100px 100px;animation:rotateSlow 12s linear infinite}
.wukong-cloud{animation:driftX 3s ease-in-out infinite}
.wukong-staff{animation:glowPulse 2.5s ease-in-out infinite}
.nezha-wheel{transform-origin:center;animation:spinWheel 2.5s linear infinite}
.nezha-sash{animation:sashFlow 3s ease-in-out infinite;transform-origin:top center}
/* ===== 10 个新角色专属动画 ===== */
/* 猪八戒：咖啡热气上升 */
@keyframes steamRise{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
.zhu-steam{animation:steamRise 2.8s ease-in-out infinite}
.zhu-steam.s2{animation-delay:.9s}
.zhu-steam.s3{animation-delay:1.8s}
/* 沙僧：文件夹上下点数 */
@keyframes folderBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sha-folders{animation:folderBob 2.8s ease-in-out infinite}
/* 白龙马：龙鳞光点依次闪烁 */
@keyframes scaleTwinkle{0%,100%{opacity:.2}50%{opacity:1}}
.bailong-scale{animation:scaleTwinkle 2.6s ease-in-out infinite}
.bailong-scale.s2{animation-delay:.6s}
.bailong-scale.s3{animation-delay:1.2s}
.bailong-scale.s4{animation-delay:1.8s}
/* 观音：光环旋转 + 净瓶光点上升 */
.guanyin-halo{transform-origin:100px 80px;animation:rotateSlow 14s linear infinite}
@keyframes bottleSpark{0%{transform:translateY(0);opacity:0}40%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.guanyin-spark{animation:bottleSpark 3s ease-in-out infinite}
.guanyin-spark.s2{animation-delay:1.2s}
/* 太白金星：星纹闪烁 + 拂尘轻摆 */
@keyframes starTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
.taibai-star{animation:starTwinkle 2.8s ease-in-out infinite}
.taibai-star.s2{animation-delay:.7s}
.taibai-star.s3{animation-delay:1.4s}
@keyframes brushSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.taibai-brush{animation:brushSway 3s ease-in-out infinite;transform-origin:top center}
/* 土地公：对讲机信号波纹扩散 */
@keyframes signalWave{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.tudi-wave{animation:signalWave 2.4s ease-out infinite}
.tudi-wave.s2{animation-delay:.8s}
/* 牛魔王：墨镜反光扫过 */
@keyframes shadeSweep{0%{transform:translateX(-8px);opacity:0}40%{opacity:.7}100%{transform:translateX(10px);opacity:0}}
.niumowang-shine{animation:shadeSweep 3.2s ease-in-out infinite}
/* 铁扇公主：折扇轻摇 + 算盘珠轻跳 */
@keyframes fanSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tieshan-fan{animation:fanSway 3s ease-in-out infinite;transform-origin:bottom center}
@keyframes abacusJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.tieshan-bead{animation:abacusJump 2.2s ease-in-out infinite}
.tieshan-bead.b2{animation-delay:.3s}
.tieshan-bead.b3{animation-delay:.6s}
/* 红孩儿：脚下火焰跳动 */
@keyframes flameFlicker{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.15) scaleX(.92)}}
.hong-flame{animation:flameFlicker 2.2s ease-in-out infinite;transform-origin:bottom center}
.hong-flame.f2{animation-delay:.4s}
.hong-flame.f3{animation-delay:.8s}
/* 二郎神：第三眼发光 + 哮天犬摇尾 */
@keyframes thirdEyeGlow{0%,100%{opacity:.4}50%{opacity:1}}
.erlang-eye{animation:thirdEyeGlow 2.6s ease-in-out infinite}
@keyframes dogWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.erlang-tail{animation:dogWag 1.8s ease-in-out infinite;transform-origin:left center}
/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .title .ch{opacity:1}
}
@media (max-width:380px){
  .title{font-size:28px}
  .char-stage{width:170px;height:170px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 开场页 ===== -->
  <section id="view-home" class="view active">
    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
    <div class="cloud c3">☁️</div>
    <svg class="scroll" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="60" rx="46" ry="20" fill="#C9A063" opacity=".25"/>
      <rect x="20" y="30" width="80" height="60" rx="6" fill="#FFFDF7" stroke="#C9A063" stroke-width="2"/>
      <line x1="32" y1="48" x2="88" y2="48" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="62" x2="80" y2="62" stroke="#C9A063" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="76" x2="72" y2="76" stroke="#C9A063" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1 class="title" id="home-title"></h1>
    <p class="subtitle">24 道职场情境题，解锁你的取经人格</p>
    <div class="home-chars" id="home-chars"></div>
    <div class="meta">
      <span>24 题</span><span>约 3 分钟</span><span>13 种取经人格</span>
    </div>
    <div class="home-actions">
      <button class="btn btn-primary" id="btn-start">开始测试</button>
      <button class="btn btn-ghost" id="btn-gallery">查看角色图鉴</button>
    </div>
    <div id="home-result-anchor"></div>
    <button class="icon-btn sound-fab" id="sound-fab" title="音效开关">🔇</button>
  </section>

  <!-- ===== 测评页 ===== -->
  <section id="view-quiz" class="view">
    <div class="progress-wrap">
      <div class="progress-meta"><span id="q-progress-text">第 1 / 24 题</span><span id="q-progress-pct">4%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="q-progress-fill" style="width:4%"></div></div>
    </div>
    <div id="q-container"></div>
    <div class="quiz-nav">
      <button class="btn btn-ghost" id="btn-prev">上一题</button>
      <button class="btn btn-primary" id="btn-next" disabled>下一题</button>
    </div>
  </section>

  <!-- ===== 结果页 ===== -->
  <section id="view-result" class="view">
    <div id="result-root"></div>
  </section>

  <!-- ===== 图鉴页 ===== -->
  <section id="view-gallery" class="view">
    <div class="back-bar">
      <button class="btn btn-ghost" id="btn-gallery-back" style="padding:8px 14px;font-size:14px">← 返回</button>
    </div>
    <div class="filter-bar" id="filter-bar">
      <button data-slot="全部" class="active">全部</button>
      <button data-slot="指挥位">指挥位</button>
      <button data-slot="攻坚位">攻坚位</button>
      <button data-slot="支撑位">支撑位</button>
      <button data-slot="协调位">协调位</button>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

</div>
<div id="toast"></div>

<script>
/* ============================================================
   DATA：维度权重 / 24 题 / 13 角色
   ============================================================ */
const DIMS = ['D1','D2','D3','D4','D5','D6','D7','D8','D9'];
const WEIGHTS = {D1:1.0,D2:1.2,D3:1.2,D4:1.2,D5:1.0,D6:1.0,D7:1.2,D8:1.0,D9:1.0};

const QUESTIONS = [
 {q:'三个急活同时压过来，你第一反应通常是？',opts:[
   {k:'A',t:'先排优先级，多线程并行推进',d:{D1:2,D9:2,D5:1}},
   {k:'B',t:'先冲最难的，边打边调',d:{D2:3,D8:1,D3:-1}},
   {k:'C',t:'先拉齐资源和相关人再动',d:{D4:2,D7:2,D5:1}},
   {k:'D',t:'先稳住底线交付，别让团队翻车',d:{D5:3,D3:1,D6:1}}]},
 {q:'领导坚持一个明显低效的流程，你会？',opts:[
   {k:'A',t:'当场指出，推动改',d:{D2:2,D3:-2,D8:1}},
   {k:'B',t:'私下给替代方案和测算',d:{D2:1,D4:2,D3:1,D1:1}},
   {k:'C',t:'先执行，找机会再优化',d:{D5:2,D3:2,D1:1}},
   {k:'D',t:'拉数据、找关键人一起说服',d:{D4:2,D7:1,D3:1,D1:1}}]},
 {q:'跨部门合作推不动，你通常？',opts:[
   {k:'A',t:'直接找对方负责人对齐目标',d:{D1:2,D4:2,D2:1}},

/* ============================================================
   ENGINE：计分与匹配
   ============================================================ */
const LS = {state:'xy_state', sound:'xy_sound', result:'xy_result'};

function computeRange(){
  const min={},max={};
  DIMS.forEach(d=>{min[d]=0;max[d]=0});
  QUESTIONS.forEach(q=>{
    DIMS.forEach(d=>{
      let mn=0,mx=0,has=false;
      q.opts.forEach(o=>{
        if(!(d in o.d))return;
        has=true;
        const v=o.d[d];
        if(v<mn)mn=v; if(v>mx)mx=v;
      });
      if(!has){mn=0;mx=0;}
      min[d]+=mn; max[d]+=mx;
    });
  });
  return {min,max};
}
const RANGE = computeRange();

function score(answers){
  const raw={}; DIMS.forEach(d=>raw[d]=0);
  const anchors={};
  QUESTIONS.forEach((q,i)=>{
    const k=answers[i]; if(!k)return;
    const opt=q.opts.find(o=>o.k===k); if(!opt)return;
    DIMS.forEach(d=>{ raw[d]+= (opt.d[d]||0); });
    if(opt.anchor){ Object.entries(opt.anchor).forEach(([rid,v])=>{ anchors[rid]=(anchors[rid]||0)+v; }); }
  });
  const U={};
  DIMS.forEach(d=>{
    const {min,max}=RANGE;
    if(max[d]===min[d]){U[d]=5;return;}
    let v=10*(raw[d]-min[d])/(max[d]-min[d]);
    U[d]=Math.max(0,Math.min(10,v));
  });
  // cosine sim with weights
  const wu2=DIMS.reduce((s,d)=>s+WEIGHTS[d]*U[d]*U[d],0);
  const scored = ROLES.map(r=>{
    let num=0, wr2=0;
    r.vec.forEach((rv,i)=>{
      const d=DIMS[i];
      num+=WEIGHTS[d]*U[d]*rv;
      wr2+=WEIGHTS[d]*rv*rv;
    });
    let sim = (wu2===0||wr2===0)?0: num/(Math.sqrt(wu2)*Math.sqrt(wr2));
    if(anchors[r.id]) sim+=anchors[r.id];
    return {role:r, sim};
  });
  // exclusion rules
  const excluded=[];
  const ruleHit=(name,list,cond)=>{ if(cond){list.forEach(id=>excluded.push(id));} };
  ruleHit('r1',['tangsen','guanyin','erlangshen'], U.D3<2 && U.D4<3);
  ruleHit('r2',['guanyin','zhubajie','taibaijinxing'], U.D6<3);
  ruleHit('r3',['niumowang','tieshangongzhu'], U.D7<3);
  ruleHit('r4',['nezha','sunwukong'], U.D8<3);
  ruleHit('r5',['honghaier','nezha'], U.D9<3);
  ruleHit('r6',['shaseng','bailongma'], U.D5<3);
  let kept = scored.filter(s=>!excluded.includes(s.role.id));
  let fallback=false;
  if(kept.length===0){ kept=scored; fallback=true; }
  kept.sort((a,b)=>b.sim-a.sim);
  const top5=scored.slice().sort((a,b)=>b.sim-a.sim).slice(0,5);
  const top3=kept.slice(0,3);
  const top1=top3[0], top2=top3[1], top3r=top3[2];
  const diff = top1.sim - (top2?top2.sim:0);
  let mode='single', sub=null;
  if(top2){
    if(diff<0.03){ mode='compound'; sub=top2; }
    else if(diff<=0.06){ mode='near'; sub=top2; }
  }
  const subPct = sub? Math.round(sub.sim/(top1.sim+sub.sim)*100):0;
  return {raw,U,top1,top2,top3:top3r,top5,mode,sub,subPct,excluded,fallback,anchors};
}

/* ============================================================
   AUDIO：Web Audio 合成音效
   ============================================================ */
const Audio2 = {
  ctx:null, on:false,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  tone(freq,dur,type='sine',gain=.12,when=0){
    if(!this.on)return; this.ensure(); if(!this.ctx)return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  click(){ this.tone(880,.08,'triangle',.1); },
  swish(){ this.tone(440,.08,'sine',.06); this.tone(660,.1,'sine',.05,.05); },
  result(){ this.tone(523,.12,'triangle',.12); this.tone(659,.12,'triangle',.12,.1); this.tone(784,.2,'triangle',.12,.2); }
};

const state = { q:0, answers:{}, result:null, slotFilter:'全部' };
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}

function showView(name){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+name).classList.add('active');
  if(name==='home'){ initPastResult(); }
  window.scrollTo(0,0);
}

function initHomeTitle(){
  const title='职场西游世界';
  const el=$('#home-title'); el.innerHTML='';
  [...title].forEach((ch,i)=>{
    const s=document.createElement('span'); s.className='ch'; s.textContent=ch;
    s.style.animationDelay=(0.15*i)+'s';
    el.appendChild(s);
  });
  el.appendChild(document.createElement('br'));
  const sub2=document.createElement('span');

  sub2.style.fontSize='18px'; sub2.style.color='var(--red)'; sub2.style.letterSpacing='4px';
  sub2.textContent='测测你是谁？';
  el.appendChild(sub2);
}

function initHomeChars(){
  const picks=['tangsen','sunwukong','zhubajie','shaseng','guanyin','nezha'];
  const box=$('#home-chars');
  box.innerHTML = picks.map(id=>{
    const r=ROLES.find(x=>x.svgKey===id); if(!r)return '';
    return `<div class="hc" title="${r.name}">${SVG_ROLES[id]||''}</div>`;
  }).join('');
}

function initPastResult(){
  const anchor=$('#home-result-anchor');
  if(state.result && state.result.top1){
    const m=state.result.top1.role;
    anchor.innerHTML=`<button class="past-result-btn" id="btn-past-result">上次测的你是「${m.name}」型 · 点我回看结果</button>`;
    $('#btn-past-result').addEventListener('click',()=>{ renderResult(state.result); showView('result'); });
  }else{
    anchor.innerHTML='';
  }
}

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(LS.state)||'null');
    if(s&&typeof s.q==='number'){ state.q=s.q; state.answers=s.answers||{}; }
    const r=localStorage.getItem(LS.result);
    if(r){ try{
      const saved=JSON.parse(r);
      if(saved.answers){ state.answers=saved.answers; state.result=score(saved.answers); }
    }catch(e){} }
    const so=localStorage.getItem(LS.sound);
    if(so==='1'){ Audio2.on=true; $('#sound-fab').textContent='🔊'; }
  }catch(e){}
}
function saveState(){ localStorage.setItem(LS.state,JSON.stringify({q:state.q,answers:state.answers})); }
function clearAll(){
  localStorage.removeItem(LS.state); localStorage.removeItem(LS.result);
  state.q=0; state.answers={}; state.result=null;
}

function renderQuestion(){
  const i=state.q; const Q=QUESTIONS[i];
  const pct=Math.round((i)/QUESTIONS.length*100);
  $('#q-progress-text').textContent=`第 ${i+1} / ${QUESTIONS.length} 题`;
  $('#q-progress-pct').textContent=pct+'%';
  $('#q-progress-fill').style.width=((i+1)/QUESTIONS.length*100)+'%';
  const container=$('#q-container');
  container.classList.remove('q-slide','back'); void container.offsetWidth;
  container.classList.add((state._dir===-1)?'back':'q-slide');
  const chosen=state.answers[i];
  const mascotKeys=['tangsen','sunwukong','zhubajie','shaseng','guanyin','nezha'];
  const mk=mascotKeys[i%mascotKeys.length];
  const mRole=ROLES.find(r=>r.svgKey===mk);
  const tips=['稳住，取经路才刚开始','凭直觉选，别想太多','这题很关键，想清楚再选','继续，你已经过半了','快到终点了，别松劲','最后冲刺！'];
  const tipIdx=Math.min(Math.floor(i/4),tips.length-1);
  container.innerHTML=`
    <div class="quiz-mascot">
      <div class="qm-ava">${SVG_ROLES[mk]||''}</div>
      <div class="qm-text"><b>${mRole?mRole.name:'玄奘'}</b>路过说：${tips[tipIdx]}</div>
    </div>
    <div class="q-card">
      <div class="q-num">QUESTION ${i+1}</div>
      <div class="q-text">${Q.q}</div>
    </div>
    <div class="opts">
      ${Q.opts.map(o=>`
        <button class="opt ${chosen===o.k?'selected':''}" data-k="${o.k}">
          <span class="key">${o.k}</span>${o.t}
        </button>`).join('')}
    </div>`;
  container.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>onSelectOption(btn.dataset.k));
  });
  $('#btn-prev').disabled = i===0;
  const isLast = i===QUESTIONS.length-1;
  const nextBtn=$('#btn-next');
  if(isLast){
    nextBtn.textContent = chosen?'查看结果':'选择后查看结果';
    nextBtn.disabled = !chosen;
  }else{
    nextBtn.textContent='下一题';
    nextBtn.disabled = !chosen;
  }
}

let _locked=false;
function onSelectOption(k){
  if(_locked)return;
  const i=state.q;
  state.answers[i]=k; saveState();
  Audio2.click();
  renderQuestion();
  const isLast = i===QUESTIONS.length-1;
  if(!isLast){
    _locked=true;
    setTimeout(()=>{
      state._dir=1; state.q=i+1; saveState(); renderQuestion(); _locked=false;
      Audio2.swish();
    },280);
  }
}

function goPrev(){
  if(state.q===0)return;
  state._dir=-1; state.q--; renderQuestion(); Audio2.swish();
}
function goNext(){
  const i=state.q;
  const isLast=i===QUESTIONS.length-1;
  if(!state.answers[i]){ toast('请先选择一个答案'); return; }
  if(isLast){ finishTest(); return; }
  state._dir=1; state.q=i+1; saveState(); renderQuestion(); Audio2.swish();
}

function startTest(){
  if(state.result){ /* 已有结果直接进测评 */ }
  showView('quiz'); renderQuestion();
}

/* 角色形象渲染：SVG 或 fallback */
function roleAvatar(role, sizeClass=''){
  if(SVG_ROLES[role.svgKey]){
    return `<div class="char-stage ${sizeClass}">${SVG_ROLES[role.svgKey]}</div>`;
  }
  const g = ['g1','g2','g3','g4','g5'][role.id.length%5];
  return `<div class="char-stage ${sizeClass}"><div class="fallback ${g}">${role.emoji}</div></div>`;
}
function roleAvatarSmall(role){
  if(SVG_ROLES[role.svgKey]){
    return `<div style="width:100%;height:100%">${SVG_ROLES[role.svgKey]}</div>`;
  }
  const g = ['g1','g2','g3','g4','g5'][role.id.length%5];
  return `<div class="fallback ${g}" style="width:100%;height:100%;font-size:34px;border-radius:50%">${role.emoji}</div>`;
}

function finishTest(){
  const res=score(state.answers);
  state.result=res;
  localStorage.setItem(LS.result,JSON.stringify({answers:state.answers, q:state.q}));
  Audio2.result();
  renderResult(res);
  showView('result');
}

function renderResult(res){
  const main=res.top1.role;
  const sub=res.sub?res.sub.role:null;
  const simPct=Math.round(res.top1.sim*100);
  const isDebug = /[?&]debug=1/.test(location.search);
  const root=$('#result-root');
  const subChip = sub? `<div class="sub-role-chip">${sub.name} ${res.subPct}% 底色</div>`:'';
  const subHero = sub? `
    <div style="display:flex;justify-content:center;gap:18px;align-items:flex-end">
      <div>${roleAvatar(main)}</div>
      <div style="width:110px;height:110px">${roleAvatarSmall(sub)}</div>
    </div>` : roleAvatar(main);
  const subNote = sub? `<div style="font-size:13px;color:var(--ink-2);margin:6px 0 4px">你是 ${main.name} 型，带 ${res.subPct}% ${sub.name} 底色</div>`:'';
  root.innerHTML=`
    <div class="hero">
      ${subChip}
      ${subHero}
      ${subNote}
      <div class="r-name">${main.name} <span style="color:var(--gold-2);font-size:18px">${main.emoji}</span></div>
      <div class="r-tag">${main.tagline}</div>

    </div>

    <div class="card">
      <h3>核心优势</h3>
      <ul class="strengths">${main.strengths.map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>
    <div class="card">
      <h3>职场盲点</h3>
      <ul class="blindspots">${main.blindspots.map(s=>`<li>${s}</li>`).join('')}</ul>
      <div class="badge89">${main.badge89}</div>
    </div>
    <div class="card">
      <h3>最佳搭档</h3>
      ${main.bestPartners.map(p=>{
        const prefix=p.name.replace(/型.*/,'').trim();
        const pr=ROLES.find(r=>r.name===prefix);
        const av=pr?roleAvatarSmall(pr):'<div style="width:44px;height:44px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center">🤝</div>';
        return `<div class="partner"><div class="p-ava" style="overflow:hidden;padding:0">${av}</div><div><div class="p-name">${p.name}</div><div class="p-reason">${p.reason}</div></div></div>`;
      }).join('')}
    </div>
    <div class="card">
      <h3>最怕遇到的管理风格</h3>
      <div style="font-size:14px;color:var(--ink-2)">${main.worstManager}</div>
    </div>
    <div class="card">
      <h3>团队缺位提示</h3>
      <div style="font-size:14px;color:var(--ink-2)">${main.teamGap}</div>
    </div>
    <div class="card">
      <h3>隐藏成就</h3>
      <div style="font-size:14px;color:var(--red);font-weight:600">${main.achievement}</div>
    </div>
    <div class="card">
      <h3>取经团队候选位（Top3 相似）</h3>
      <div class="mini-roster">
        ${[res.top1,res.top2,res.top3].filter(Boolean).map((s,idx)=>`
          <div class="mini-role">
            <div class="m-ava">${roleAvatarSmall(s.role)}</div>
            <div class="m-name">${s.role.name}</div>
            <div class="m-sim">${Math.round(s.sim*100)}% · ${idx===0?'主':idx===1?'次':'三'}</div>
          </div>`).join('')}
      </div>
    </div>
    ${isDebug?`<div class="card"><h3>调试信息</h3><div class="debug-box">${renderDebug(res)}</div></div>`:''}
    <div class="result-actions">
      <button class="btn btn-gold" id="btn-poster">生成分享海报</button>
      <button class="btn btn-primary" id="btn-teamcard">生成组队卡</button>
      <button class="btn btn-ghost" id="btn-copy">复制分享文案</button>
      <button class="btn btn-ghost" id="btn-retry">重新测试</button>
      <button class="btn btn-ghost full" id="btn-gallery2">查看角色图鉴</button>
    </div>
  `;
  $('#btn-poster').addEventListener('click',()=>drawPoster(res));
  $('#btn-teamcard').addEventListener('click',()=>drawTeamCard(res));
  $('#btn-copy').addEventListener('click',()=>copyShare(res));
  $('#btn-retry').addEventListener('click',()=>{ clearAll(); startTest(); });
  $('#btn-gallery2').addEventListener('click',()=>renderGallery());
}

function renderDebug(res){
  const L=[];
  L.push('== 9 维得分 U_d (0-10) ==');
  DIMS.forEach((d,i)=>L.push(`${d} (${['目标驱动','破局行动','规则边界','协作影响','稳定交付','情绪价值','资源整合','抗压复原','快攻节奏'][i]}): ${res.U[d].toFixed(2)}`));
  L.push(''); L.push('== Top5 相似度 ==');
  res.top5.forEach((s,i)=>L.push(`${i+1}. ${s.role.name}: ${(s.sim).toFixed(4)}`));
  L.push(''); L.push('== 排除规则触发 ==');
  L.push(res.excluded.length? ('排除角色: '+res.excluded.join(',')) : '无排除');
  L.push('fallback(全排除回退): '+res.fallback);
  L.push(''); L.push('== 复合规则 ==');
  L.push('mode: '+res.mode+'  subPct: '+res.subPct+'%');
  L.push('anchors: '+JSON.stringify(res.anchors));
  return L.join('\n');
}

/* ===== 图鉴 ===== */
function renderGallery(){
  showView('gallery');
  const grid=$('#gallery-grid');
  const list = state.slotFilter==='全部'? ROLES : ROLES.filter(r=>r.teamSlot===state.slotFilter);
  grid.innerHTML = list.map(r=>`
    <div class="g-card" data-id="${r.id}">
      <div class="g-ava">${roleAvatarSmall(r)}</div>
      <div class="g-name">${r.name}</div>

  grid.querySelectorAll('.g-card').forEach(c=>{
    c.addEventListener('click',()=>{
      const role=ROLES.find(r=>r.id===c.dataset.id);
      toast(`${role.name} · ${role.archetype} · ${role.teamSlot}`);
    });
  });

/* ===== 分享文案 ===== */
function copyShare(res){
  const m=res.top1.role;
  const txt=`我在职场西游世界是${m.name}型｜${m.tagline}。优势：${m.strengths[0]}、${m.strengths[1]}。最佳搭档：${m.bestPartners[0].name}。最怕遇到：${m.worstManager}。你是哪个打工人？`;
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制分享文案'); }catch(e){ toast('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('已复制分享文案')).catch(fallback);
  }else fallback();
}

/* ===== 海报 / 组队卡 Canvas ===== */
function svgToImage(svgStr){
  return new Promise((resolve,reject)=>{
    // 注入显式宽高，否则 Blob 加载的 SVG 在 Canvas 上渲染为 0 尺寸
    const sized = svgStr.replace('<svg ', '<svg width="200" height="200" ');
    const blob=new Blob([sized],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=(e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src=url;
  });
}
async function drawRoleOnCanvas(ctx, role, cx, cy, size){
  try{
    if(SVG_ROLES[role.svgKey]){
      const img=await svgToImage(SVG_ROLES[role.svgKey]);
      ctx.drawImage(img, cx-size/2, cy-size/2, size, size);
    }else{
      // fallback: circle + emoji
      const g=ctx.createRadialGradient(cx-size/4,cy-size/4,size/8,cx,cy,size/2);
      g.addColorStop(0,'#F5D9A8'); g.addColorStop(1,'#C9A063');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,size/2,0,Math.PI*2); ctx.fill();
      ctx.font=`${size*0.5}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(role.emoji,cx,cy+2);
    }
  }catch(e){
    ctx.fillStyle='#C9A063'; ctx.beginPath(); ctx.arc(cx,cy,size/2,0,Math.PI*2); ctx.fill();
    ctx.font=`${size*0.5}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(role.emoji,cx,cy+2);
  }
}
function downloadCanvas(canvas, filename){
  try{
    const a=document.createElement('a');
    a.download=filename;
    a.href=canvas.toDataURL('image/png');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('已保存 '+filename);
  }catch(e){
    toast('生成失败，已复制文字');
  }
}

async function drawPoster(res){
  const W=750,H=1334;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  // bg
  ctx.fillStyle='#F6F1E7'; ctx.fillRect(0,0,W,H);
  // top banner
  const grad=ctx.createLinearGradient(0,0,0,200);
  grad.addColorStop(0,'#C0392B'); grad.addColorStop(1,'#8E2A1F');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,200);
  ctx.fillStyle='#FFFDF7'; ctx.textAlign='center';
  ctx.font='bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('职场西游世界',W/2,80);
  ctx.font='22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('测测你是谁？',W/2,125);
  ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='#F5D9A8';
  ctx.fillText('我在职场西游里是'+res.top1.role.name+'，你是哪个打工人？',W/2,165);
  // main role
  const main=res.top1.role;
  await drawRoleOnCanvas(ctx,main,W/2,380,280);
  ctx.fillStyle='#2A2622'; ctx.font='bold 46px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(main.name+' · '+Math.round(res.top1.sim*100)+'%',W/2,560);
  ctx.fillStyle='#C0392B'; ctx.font='22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(main.tagline,W/2,595);
  ctx.fillStyle='#5C544A'; ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(main.archetype,W/2,625);
  // strengths
  ctx.textAlign='left';
  ctx.fillStyle='#C9A063'; ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('◆ 核心优势',60,690);
  ctx.fillStyle='#2A2622'; ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  main.strengths.forEach((s,i)=>ctx.fillText('· '+s,80,725+i*32));
  // partners
  ctx.fillStyle='#C9A063'; ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('◆ 最佳搭档',60,845);
  ctx.fillStyle='#2A2622'; ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  main.bestPartners.forEach((p,i)=>ctx.fillText('· '+p.name+'：'+p.reason,80,880+i*32));
  // deco QR placeholder
  ctx.strokeStyle='#2A2622'; ctx.lineWidth=3;
  const qx=W/2-60, qy=1080, qs=120;
  ctx.strokeRect(qx,qy,qs,qs);
  ctx.fillStyle='#2A2622';
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){ if((i*7+j*13)%3===0) ctx.fillRect(qx+8+i*13,qy+8+j*13,10,10); }
  ctx.textAlign='center'; ctx.fillStyle='#8A8072'; ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('扫码来测你的取经人格',W/2,1230);
  ctx.fillStyle='#C0392B'; ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('职场西游 · 24 题解锁你的人格',W/2,1280);
  downloadCanvas(c,'职场西游-'+main.name+'.png');
}

async function drawTeamCard(res){
  const W=750,H=1000;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#F6F1E7'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#C0392B'; ctx.font='bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('我的取经小队',W/2,90);
  ctx.fillStyle='#8A8072'; ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('三人站位，补齐你的取经版图',W/2,125);
  // three roles: main + 2 partners
  const main=res.top1.role;
  const partners = main.bestPartners.map(p=>{
    // find role by name prefix
    const prefix=p.name.replace(/型.*/,'').trim();
    return ROLES.find(r=>r.name===prefix)||ROLES[0];
  }).slice(0,2);
  const xs=[W/2, W*0.22, W*0.78];
  const sizes=[200,140,140];
  const names=[main.name, partners[0].name, partners[1].name];
  const tags=['我','搭档 A','搭档 B'];
  for(let i=0;i<3;i++){
    const role = i===0?main:partners[i-1];
    await drawRoleOnCanvas(ctx, role, xs[i], 320+(i===0?0:20), sizes[i]);
    ctx.fillStyle='#2A2622'; ctx.font='bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(names[i], xs[i], 460+(i===0?0:20));
    ctx.fillStyle='#C0392B'; ctx.font='16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(tags[i], xs[i], 488+(i===0?0:20));
  }
  // connecting line
  ctx.strokeStyle='#C9A063'; ctx.lineWidth=3; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(xs[1],340); ctx.lineTo(xs[0],340); ctx.lineTo(xs[2],340); ctx.stroke();
  ctx.setLineDash([]);
  // bottom text
  ctx.fillStyle='#5C544A'; ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('你的团队缺谁？拉他来测。',W/2,720);
  // deco bottom bar
  ctx.fillStyle='#C0392B'; ctx.fillRect(0,H-80,W,80);
  ctx.fillStyle='#FFFDF7'; ctx.font='bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('职场西游世界 · 取经小队集结',W/2,H-35);
  downloadCanvas(c,'职场西游-组队卡.png');
}

function bind(){
  initHomeTitle();
  loadState();
  initHomeChars();

    Audio2.click(); startTest();
  });
  $('#btn-gallery').addEventListener('click',()=>{ Audio2.click(); renderGallery(); });
  $('#btn-gallery-back').addEventListener('click',()=>{ showView('home'); });
  $('#btn-prev').addEventListener('click',goPrev);
  $('#btn-next').addEventListener('click',goNext);
  $('#sound-fab').addEventListener('click',()=>{
    Audio2.on=!Audio2.on;
    $('#sound-fab').textContent=Audio2.on?'🔊':'🔇';
    localStorage.setItem(LS.sound, Audio2.on?'1':'0');
    if(Audio2.on)Audio2.click();
  });
  $('#filter-bar').addEventListener('click',e=>{
    const b=e.target.closest('button[data-slot]'); if(!b)return;
    $$('#filter-bar button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.slotFilter=b.dataset.slot;
    renderGallery();
  });
}
bind();
