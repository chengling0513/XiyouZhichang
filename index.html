<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>职场西游世界，测测你是谁？</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
:root{
  --bg:#f6f1e7;
  --bg2:#efe7d8;
  --card:#ffffff;
  --ink:#2f2a26;
  --ink2:#6b6259;
  --ink3:#9a9188;
  --red:#c43b2f;
  --red2:#e05a45;
  --gold:#d9a441;
  --gold2:#f0c469;
  --line:rgba(47,42,38,.10);
  --shadow:0 8px 24px -12px rgba(47,42,38,.28);
  --shadow-lg:0 18px 44px -22px rgba(47,42,38,.38);
}
body{
  margin:0;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(680px 420px at 50% -10%, rgba(217,164,65,.16), rgba(246,241,231,0) 70%),
    linear-gradient(180deg,#f9f4ea 0%, #f6f1e7 48%, #f1e9db 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.app{max-width:720px;margin:0 auto;padding:18px 16px 84px;}
@media(min-width:768px){.app{padding:28px 24px 96px;}}

.screen{display:none;}
.screen.active{display:block;animation:screenIn .38s cubic-bezier(.2,.8,.2,1);}
@keyframes screenIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------------- 通用按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-size:16px;font-weight:600;
  border:none;border-radius:14px;padding:14px 22px;cursor:pointer;
  transition:transform .16s ease,box-shadow .2s ease,background .2s ease,opacity .2s;
  -webkit-tap-highlight-color:transparent;
  text-decoration:none;
}
.btn:active{transform:scale(.975);}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
.btn-primary{
  background:linear-gradient(135deg,#e0574a 0%,var(--red) 55%,#a72e24 100%);
  color:#fff;
  box-shadow:0 12px 26px -14px rgba(196,59,47,.85),inset 0 1px 0 rgba(255,255,255,.24);
}
.btn-gold{
  background:linear-gradient(135deg,#f4cf80 0%,#d9a441 60%,#bd8a2a 100%);
  color:#3a2a09;
  box-shadow:0 12px 26px -14px rgba(217,164,65,.9),inset 0 1px 0 rgba(255,255,255,.42);
}
.btn-ghost{
  background:#fff;color:var(--ink2);border:1.5px solid var(--line);
  box-shadow:0 4px 12px -8px rgba(47,42,38,.3);
}
.btn-ghost:hover{background:#fdfaf4;}

/* ---------------- 开场页 ---------------- */
#scr-home{position:relative;overflow:hidden;}
.home-clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.cloud{
  position:absolute;width:190px;height:66px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(255,255,255,0));
  filter:blur(2px);
}
.cloud-l{top:14%;left:-90px;animation:cloudInL 1.5s cubic-bezier(.2,.8,.2,1) .1s both, floatY 7s ease-in-out 1.6s infinite;}
.cloud-r{top:26%;right:-90px;animation:cloudInR 1.5s cubic-bezier(.2,.8,.2,1) .18s both, floatY 8s ease-in-out 1.8s infinite;}
.cloud-l2{top:62%;left:-120px;width:150px;height:52px;animation:cloudInL 1.8s cubic-bezier(.2,.8,.2,1) .3s both;}
.cloud-r2{top:72%;right:-120px;width:150px;height:52px;animation:cloudInR 1.8s cubic-bezier(.2,.8,.2,1) .36s both;}
@keyframes cloudInL{from{transform:translateX(-160px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes cloudInR{from{transform:translateX(160px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

.home-inner{
  position:relative;z-index:2;
  min-height:calc(100vh - 110px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16px 0 26px;
}
.scroll-badge{
  display:inline-block;
  font-size:11px;letter-spacing:.26em;color:var(--red);
  background:linear-gradient(180deg,#fffdf8,#fdf4e4);
  border:1px solid rgba(217,164,65,.5);
  padding:7px 18px;border-radius:999px;margin-bottom:24px;
  box-shadow:0 6px 18px -12px rgba(217,164,65,.9);
  transform-origin:center;
  animation:scrollOpen .7s cubic-bezier(.2,.9,.2,1) both;
}
@keyframes scrollOpen{from{transform:scaleX(.08);opacity:0;}to{transform:scaleX(1);opacity:1;}}

.hero-title{
  margin:0 0 16px;font-size:clamp(26px,7.6vw,40px);line-height:1.3;
  letter-spacing:.03em;font-weight:800;
  background:linear-gradient(160deg,#3a322b 0%,#a02c22 55%,#c43b2f 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:#a02c22;
}
.hero-title span{display:inline-block;opacity:0;transform:translateY(14px);animation:charIn .52s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes charIn{to{opacity:1;transform:none;}}
.hero-sub{margin:0 0 10px;font-size:clamp(14px,4vw,17px);color:var(--ink2);letter-spacing:.03em;}
.hero-meta{margin:0 0 34px;font-size:12.5px;color:var(--ink3);letter-spacing:.08em;}
.home-inner .btn{width:100%;max-width:330px;margin-bottom:12px;}
.resume-hint{margin:6px 0 0;font-size:12.5px;color:var(--gold);letter-spacing:.04em;}

/* ---------------- 测评页 ---------------- */
.quiz-head{position:sticky;top:0;z-index:30;padding:12px 0 14px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 72%,rgba(246,241,231,0) 100%);}
.quiz-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);margin-bottom:9px;letter-spacing:.04em;}
.quiz-meta b{color:var(--red);font-weight:800;font-size:15px;}
.pbar{height:7px;border-radius:999px;background:rgba(47,42,38,.09);overflow:hidden;}
.pbar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--red2));transition:width .4s cubic-bezier(.4,0,.2,1);}

#quiz-body{will-change:transform,opacity;}
.slide-right{animation:slideInRight .32s cubic-bezier(.2,.8,.2,1);}
.slide-left{animation:slideInLeft .32s cubic-bezier(.2,.8,.2,1);}
@keyframes slideInRight{from{opacity:0;transform:translateX(44px);}to{opacity:1;transform:none;}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-44px);}to{opacity:1;transform:none;}}

.qcard{
  margin:8px 0 16px;padding:20px 18px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:17px;line-height:1.62;font-weight:700;color:var(--ink);
}
.qcard .q-index{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:9px;}

.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  font-family:inherit;font-size:15px;line-height:1.55;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:14px 15px;margin-bottom:11px;cursor:pointer;
  box-shadow:0 5px 16px -12px rgba(47,42,38,.35);
  transition:background .18s,border-color .18s,box-shadow .18s,transform .28s cubic-bezier(.2,.8,.2,1);
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{border-color:rgba(217,164,65,.55);background:#fffdf8;}
.opt.selected{
  background:linear-gradient(135deg,#fff8ec,#fff2df);
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(217,164,65,.22),0 12px 28px -18px rgba(217,164,65,.9);
  transform:scale(1.015);
}
.opt-key{
  flex:0 0 27px;height:27px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;font-size:12px;font-weight:800;
  background:rgba(47,42,38,.07);color:var(--ink2);
  transition:background .18s,color .18s;
}
.opt.selected .opt-key{background:var(--red);color:#fff;}
.opt-text{flex:1;padding-top:2px;}

.nav{display:flex;gap:10px;margin-top:18px;}
.nav .btn{flex:1;padding:13px 12px;font-size:15px;}
.tip{text-align:center;font-size:12.5px;color:var(--ink3);margin:14px 0 0;min-height:18px;letter-spacing:.03em;}

/* ---------------- 结果页 ---------------- */
.res-hero{
  position:relative;overflow:hidden;text-align:center;
  padding:26px 18px 24px;border-radius:20px;
  background:
    radial-gradient(120% 78% at 50% 0%, rgba(217,164,65,.20), rgba(217,164,65,0) 64%),
    linear-gradient(180deg,#ffffff,#fdf7ec);
  border:1px solid rgba(217,164,65,.36);
  box-shadow:var(--shadow-lg);
}
.hero-figure{position:relative;width:170px;height:170px;margin:0 auto 6px;}
.hero-figure .fig-main{width:170px;height:170px;}
.hero-figure.is-comp .fig-main{transform:translateX(-26px) scale(.92);}
.fig-sub{
  position:absolute;right:-14px;bottom:2px;width:82px;height:82px;
  border-radius:50%;background:#fff;border:2px solid var(--gold2);
  box-shadow:0 8px 20px -10px rgba(217,164,65,.9);overflow:hidden;
}
.fig-sub .char-svg{width:100%;height:100%;}
.hero-name{font-size:30px;font-weight:800;letter-spacing:.06em;margin-top:6px;}
.hero-tagline{font-size:14px;color:var(--red);margin-top:7px;letter-spacing:.05em;font-weight:600;}
.hero-arch{font-size:12.5px;color:var(--ink3);margin-top:5px;letter-spacing:.05em;}
.hero-pct{
  display:inline-block;margin-top:13px;font-size:13px;font-weight:700;color:#8a6417;
  background:rgba(217,164,65,.16);border:1px solid rgba(217,164,65,.42);
  padding:5px 15px;border-radius:999px;letter-spacing:.05em;
}
.composite-line{
  margin-top:12px;font-size:13.5px;color:var(--ink2);line-height:1.6;
  background:rgba(196,59,47,.06);border:1px dashed rgba(196,59,47,.28);
  border-radius:12px;padding:9px 14px;display:inline-block;
}

.panel{
  margin-top:16px;padding:18px 16px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
}
.panel h3{
  margin:0 0 14px;font-size:14.5px;font-weight:800;letter-spacing:.06em;
  display:flex;align-items:center;gap:9px;color:var(--ink);
}
.panel h3::before{content:'';width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,var(--red2),var(--gold));}

.list-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;font-size:14.5px;line-height:1.65;color:var(--ink2);}
.list-item:last-child{margin-bottom:0;}
.list-item .dot{
  flex:0 0 20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--red2),var(--red));margin-top:1px;
}
.list-item.warn .dot{background:linear-gradient(145deg,#e8a23c,#c07a1c);}

.badge89{
  margin-top:16px;padding:15px 16px;border-radius:14px;
  background:linear-gradient(135deg,#fff6e8,#fdf0dc);
  border:1px dashed rgba(217,164,65,.65);
  font-size:14.5px;line-height:1.7;color:#7a5a18;font-weight:600;
}
.badge89 b{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:7px;font-weight:800;}

.partner-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.partner-item:last-child{border-bottom:none;padding-bottom:0;}
.partner-avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#fdf4e4;border:1.5px solid rgba(217,164,65,.4);}
.partner-avatar .char-svg{width:100%;height:100%;}
.partner-name{font-size:14.5px;font-weight:700;color:var(--ink);}
.partner-reason{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.5;}

.info-row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
.info-row:last-child{border-bottom:none;padding-bottom:0;}
.info-row .k{flex:0 0 84px;font-size:12.5px;color:var(--ink3);letter-spacing:.05em;padding-top:2px;}
.info-row .v{flex:1;font-size:14px;line-height:1.62;color:var(--ink2);}

.cand-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.cand-card{
  padding:11px 6px;border-radius:13px;text-align:center;
  background:linear-gradient(180deg,#fffdf8,#fdf7ec);
  border:1px solid var(--line);
}
.cand-card.first{border-color:rgba(196,59,47,.4);background:linear-gradient(180deg,#fff8f4,#fdeee8);}
.cand-rank{font-size:10px;letter-spacing:.12em;color:var(--ink3);margin-bottom:6px;}
.cand-avatar{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:#fdf4e4;}
.cand-avatar .char-svg{width:100%;height:100%;}
.cand-name{font-size:13.5px;font-weight:800;color:var(--ink);}
.cand-slot{font-size:11px;color:var(--ink3);margin-top:3px;}
.cand-pct{font-size:12.5px;font-weight:800;color:var(--red);margin-top:5px;}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.actions .btn{width:100%;font-size:14.5px;padding:13px 10px;}
.actions .btn.full{grid-column:1 / -1;}

.debug-box{margin-top:16px;padding:16px;border-radius:14px;background:#26221e;color:#cfc8bd;font-size:12px;line-height:1.8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;}
.debug-box h4{margin:0 0 10px;color:#f0c469;font-size:12px;letter-spacing:.1em;}
.debug-box .dbg-row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:3px 0;}
.debug-box .dbg-sub{margin-top:10px;color:#8fbf8f;}

/* ---------------- 角色 SVG / fallback ---------------- */
.char-svg{width:100%;height:100%;display:block;overflow:visible;}
.char-fallback{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 26%, var(--c1,#ffe9c4), var(--c2,#e9b45c));
  box-shadow:inset 0 -6px 16px rgba(0,0,0,.09), 0 8px 22px -14px rgba(47,42,38,.5);
  animation:fbBreathe 3.4s ease-in-out infinite;
}
.fb-emoji{font-size:44%;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.16));}
@keyframes fbBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
.mini-fb{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:radial-gradient(circle at 34% 26%,#ffe9c4,#e9b45c);
}

/* ---------------- 图鉴 ---------------- */
.gal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.gal-head h2{margin:0;font-size:19px;letter-spacing:.05em;font-weight:800;}
.gal-back{
  background:#fff;border:1.5px solid var(--line);color:var(--ink2);
  font-family:inherit;font-size:13px;padding:8px 15px;border-radius:11px;cursor:pointer;
  box-shadow:0 4px 12px -10px rgba(47,42,38,.5);
}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{
  flex:0 0 auto;font-family:inherit;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;
  background:#fff;border:1.5px solid var(--line);color:var(--ink2);
  transition:background .18s,color .18s,border-color .18s;
  -webkit-tap-highlight-color:transparent;
}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;box-shadow:0 8px 18px -12px rgba(196,59,47,.9);}

.gal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
@media(min-width:560px){.gal-grid{grid-template-columns:repeat(3,1fr);}}
.gal-card{
  padding:14px 10px 13px;border-radius:16px;text-align:center;cursor:pointer;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.gal-card:hover{transform:translateY(-2px);border-color:rgba(217,164,65,.5);box-shadow:var(--shadow-lg);}
.gal-avatar{width:76px;height:76px;margin:0 auto 9px;border-radius:50%;overflow:hidden;background:#fdf4e4;}
.gal-name{font-size:15px;font-weight:800;letter-spacing:.04em;}
.gal-tag{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.45;min-height:32px;}
.gal-slot{display:inline-block;margin-top:7px;font-size:10.5px;color:var(--red);background:rgba(196,59,47,.08);border:1px solid rgba(196,59,47,.2);padding:2px 9px;border-radius:999px;}

.gal-detail{margin-top:12px;padding:16px 15px;border-radius:14px;background:#fffdf8;border:1px solid rgba(217,164,65,.4);text-align:left;}
.gal-detail h4{margin:0 0 8px;font-size:14px;color:var(--red);letter-spacing:.05em;}
.gal-detail p{margin:0 0 9px;font-size:13.5px;line-height:1.7;color:var(--ink2);}
.gal-detail p:last-child{margin-bottom:0;}
.gal-detail .lbl{color:var(--ink3);font-size:12px;margin-right:5px;}

/* ---------------- toast / 音效 ---------------- */
.toast{
  position:fixed;left:50%;bottom:40px;z-index:999;transform:translate(-50%,18px);
  max-width:86vw;text-align:center;
  background:rgba(47,42,38,.96);color:#fdf4e4;
  font-size:13.5px;line-height:1.5;padding:11px 22px;border-radius:999px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.sound-toggle{
  position:fixed;right:16px;bottom:18px;z-index:200;
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;
  background:#fff;border:1.5px solid var(--line);color:var(--ink2);
  box-shadow:0 10px 26px -14px rgba(47,42,38,.6);cursor:pointer;
  transition:transform .16s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.sound-toggle:active{transform:scale(.94);}
.sound-toggle.on{background:linear-gradient(145deg,#fff3d8,#f6dfae);border-color:rgba(217,164,65,.7);}

/* ---------------- 动效降级 ---------------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .hero-title span{opacity:1 !important;transform:none !important;}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 开场页 ============ -->
  <section id="scr-home" class="screen active">
    <div class="home-clouds" aria-hidden="true">
      <div class="cloud cloud-l"></div>
      <div class="cloud cloud-r"></div>
      <div class="cloud cloud-l2"></div>
      <div class="cloud cloud-r2"></div>
    </div>
    <div class="home-inner">
      <div class="scroll-badge">取经项目组 · 人格测评</div>
      <h1 class="hero-title" id="hero-title">职场西游世界，测测你是谁？</h1>
      <p class="hero-sub">24 道职场情境题，解锁你的取经人格</p>
      <p class="hero-meta">24 题 · 约 3 分钟 · 13 种取经人格</p>
      <button class="btn btn-primary" id="btn-start" type="button">开始测试</button>
      <button class="btn btn-ghost" id="btn-gallery" type="button">查看角色图鉴</button>
      <p class="resume-hint" id="resume-hint" hidden></p>
    </div>
  </section>

  <!-- ============ 测评页 ============ -->
  <section id="scr-quiz" class="screen">
    <div class="quiz-head">
      <div class="quiz-meta">
        <span>第 <b id="q-num">1</b> / 24 题</span>
        <span id="q-pct">4%</span>
      </div>
      <div class="pbar"><i id="pbar-fill"></i></div>
    </div>
    <div id="quiz-body">
      <div class="qcard">
        <span class="q-index" id="q-index-label">QUESTION 01</span>
        <span id="q-text"></span>
      </div>
      <div id="opt-list"></div>
    </div>
    <div class="nav">
      <button class="btn btn-ghost" id="btn-prev" type="button">上一题</button>
      <button class="btn btn-primary" id="btn-next" type="button">下一题</button>
    </div>
    <p class="tip" id="quiz-tip">选择后会自动进入下一题</p>
  </section>

  <!-- ============ 结果页 ============ -->
  <section id="scr-result" class="screen">
    <div id="result-root"></div>

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

const RANGES = (function(){
  const mn = {}, mx = {};
  DIM_KEYS.forEach(function(k){ mn[k]=0; mx[k]=0; });
  QUESTIONS.forEach(function(q){
    DIM_KEYS.forEach(function(k){
      const vals = q.options.map(function(o){ return (o.score && o.score[k]) || 0; });
      mx[k] += Math.max.apply(null, vals);
      mn[k] += Math.min.apply(null, vals);
    });
  });
  return { min:mn, max:mx };
})();

function computeRawAndU(answers){
  const raw = {};
  DIM_KEYS.forEach(function(k){ raw[k]=0; });
  QUESTIONS.forEach(function(q,i){
    const ai = answers[i];
    if (ai === null || ai === undefined) return;
    const sc = q.options[ai].score || {};
    DIM_KEYS.forEach(function(k){ raw[k] += (sc[k] || 0); });
  });
  const U = {};
  DIM_KEYS.forEach(function(k){
    const span = RANGES.max[k] - RANGES.min[k];
    U[k] = span === 0 ? 5 : clamp(10 * (raw[k] - RANGES.min[k]) / span, 0, 10);
  });
  return { raw:raw, U:U };
}

function cosine(U, R){
  let num = 0, sa = 0, sb = 0;
  for (let i = 0; i < DIM_KEYS.length; i++){
    const k = DIM_KEYS[i];
    const w = DIM_META[k].w;
    const u = U[k];
    const r = R[i];
    num += w * u * r;
    sa  += w * u * u;
    sb  += w * r * r;
  }
  const den = Math.sqrt(sa) * Math.sqrt(sb);
  return den === 0 ? 0 : num / den;
}

function computeAnchors(answers){
  const bonus = {};
  [22,23].forEach(function(qi){
    const ai = answers[qi];
    if (ai === null || ai === undefined) return;
    const anc = QUESTIONS[qi].options[ai].anchor;
    if (!anc) return;
    Object.keys(anc).forEach(function(id){
      bonus[id] = (bonus[id] || 0) + anc[id];
    });
  });
  return bonus;
}

function computeExclusions(U){
  const ex = {};
  const hits = [];
  function add(list, rule){
    let any = false;
    list.forEach(function(id){ if(!ex[id]){ ex[id]=true; any=true; } });
    if (any) hits.push(rule);
  }
  if (U.D3 < 2 && U.D4 < 3) add(['tangseng','guanyin','erlangshen'], 'U.D3<2 且 U.D4<3 → 排除 唐僧/观音/二郎神');
  if (U.D6 < 3) add(['guanyin','zhubajie','taibaijinxing'], 'U.D6<3 → 排除 观音/猪八戒/太白金星');
  if (U.D7 < 3) add(['niumowang','tieshangongzhu'], 'U.D7<3 → 排除 牛魔王/铁扇公主');
  if (U.D8 < 3) add(['nezha','sunwukong'], 'U.D8<3 → 排除 哪吒/孙悟空');
  if (U.D9 < 3) add(['honghaier','nezha'], 'U.D9<3 → 排除 红孩儿/哪吒');
  if (U.D5 < 3) add(['shaseng','bailongma'], 'U.D5<3 → 排除 沙僧/白龙马');
  return { set:ex, hits:hits };
}

function evaluate(answers){
  const ru = computeRawAndU(answers);
  const anchors = computeAnchors(answers);
  const exInfo = computeExclusions(ru.U);

  const all = ROLES.map(function(role, idx){
    const base = cosine(ru.U, role.vector);
    const bonus = anchors[role.id] || 0;
    return { role:role, idx:idx, base:base, bonus:bonus, sim:base + bonus };
  });

  const excludedRoles = all.filter(function(x){ return exInfo.set[x.role.id]; });
  let pool = all.filter(function(x){ return !exInfo.set[x.role.id]; });
  let fallback = false;
  if (pool.length === 0){ pool = all.slice(); fallback = true; }

  pool.sort(function(a,b){ return b.sim - a.sim || a.idx - b.idx; });
  const allSorted = all.slice().sort(function(a,b){ return b.sim - a.sim || a.idx - b.idx; });

  const top3 = pool.slice(0,3);
  const t1 = top3[0];
  const t2 = top3[1] || null;

  let gap = 1, composite = false, secondary = false;
  if (t2){
    gap = t1.sim - t2.sim;
    if (gap < 0.03) composite = true;
    else if (gap <= 0.06) secondary = true;
  }

  const pct = Math.round(clamp(t1.sim, 0, 1) * 100);
  const compositePct = (composite && t2)
    ? Math.round(t2.sim / (t1.sim + t2.sim) * 100)
    : 0;

  return {
    raw:ru.raw, U:ru.U, anchors:anchors,
    exclusions:exInfo, excludedRoles:excludedRoles,
    top3:top3, top5:allSorted.slice(0,5), allSorted:allSorted,
    t1:t1, t2:t2, gap:gap, composite:composite, secondary:secondary,
    pct:pct, compositePct:compositePct, fallback:fallback
  };
}

function findRoleByName(str){
  const sorted = ROLES.slice().sort(function(a,b){ return b.name.length - a.name.length; });
  for (let i = 0; i < sorted.length; i++){
    if (str.indexOf(sorted[i].name) !== -1) return sorted[i];
  }
  return null;
}

/* =====================================================================
 *  AUDIO
 * ===================================================================== */
const Sound = {
  ctx: null,
  on: false,
  init: function(){
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch(e){ return null; }
  },
  blip: function(freq, dur, type, vol){
    if (!this.on) return;
    const ctx = this.init();
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  click: function(){ this.blip(900, 0.13, 'sine', 0.08); },
  swipe: function(){
    if (!this.on) return;
    const ctx = this.init(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime;
    o.type = 'triangle';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.exponentialRampToValueAtTime(380, t + 0.12);
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.16);
  },
  result: function(){
    if (!this.on) return;
    const self = this;
    [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i){
      setTimeout(function(){ self.blip(f, 0.34, 'sine', 0.075); }, i * 110);
    });
  }
};

function renderQuiz(dir){
  const idx = state.index;
  const q = QUESTIONS[idx];
  const keys = ['A','B','C','D'];

  $('#q-num').textContent = String(idx + 1);
  $('#q-pct').textContent = Math.round(((idx + 1) / TOTAL) * 100) + '%';
  $('#pbar-fill').style.width = (((idx + 1) / TOTAL) * 100).toFixed(2) + '%';
  $('#q-index-label').textContent = 'QUESTION ' + (idx + 1 < 10 ? '0' : '') + (idx + 1);
  $('#q-text').textContent = q.text;

  const list = $('#opt-list');
  list.innerHTML = '';
  q.options.forEach(function(opt, i){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (state.answers[idx] === i ? ' selected' : '');
    b.setAttribute('data-opt', String(i));
    const k = document.createElement('span');
    k.className = 'opt-key';
    k.textContent = keys[i];
    const t = document.createElement('span');
    t.className = 'opt-text';
    t.textContent = opt.text;
    b.appendChild(k); b.appendChild(t);
    b.addEventListener('click', function(){ onPick(i); });
    list.appendChild(b);
  });

  const prev = $('#btn-prev');
  const next = $('#btn-next');
  prev.disabled = (idx === 0);

  const isLast = (idx === TOTAL - 1);
  next.textContent = isLast ? '查看结果' : '下一题';
  next.disabled = (state.answers[idx] === null);

  const tip = $('#quiz-tip');
  if (isLast){
    tip.textContent = state.answers[idx] === null
      ? '请选择一个答案，然后点击「查看结果」'
      : '已选择，点击「查看结果」生成你的取经人格';
  } else {
    tip.textContent = '选择后会自动进入下一题';
  }

  if (dir){
    const body = $('#quiz-body');
    body.classList.remove('slide-right','slide-left');
    void body.offsetWidth;
    body.classList.add(dir === 'back' ? 'slide-left' : 'slide-right');
  }
}

function onPick(optionIndex){
  if (state.locked) return;
  const idx = state.index;

  state.answers[idx] = optionIndex;
  saveProgress();
  Sound.click();

  const opts = document.querySelectorAll('#opt-list .opt');
  for (let i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
  const target = document.querySelector('#opt-list .opt[data-opt="' + optionIndex + '"]');
  if (target) target.classList.add('selected');

  const nextBtn = $('#btn-next');
  const isLast = (idx === TOTAL - 1);

  if (isLast){
    nextBtn.disabled = false;
    $('#quiz-tip').textContent = '已选择，点击「查看结果」生成你的取经人格';
    return;
  }

  state.locked = true;
  if (advanceTimer) clearTimeout(advanceTimer);
  advanceTimer = setTimeout(function(){
    advanceTimer = null;
    state.locked = false;
    if (state.index !== idx) return;
    if (state.answers[idx] !== optionIndex) return;
    state.index = idx + 1;
    saveProgress();
    Sound.swipe();
    renderQuiz('forward');
  }, 280);
}

function goPrev(){
  if (state.locked) return;
  if (state.index === 0) return;
  if (advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
  state.index -= 1;
  saveProgress();
  Sound.swipe();
  renderQuiz('back');
}

function goNext(){
  if (state.locked) return;
  if (state.answers[state.index] === null){
    toast('请先选择一个答案');
    return;
  }
  if (state.index === TOTAL - 1){
    finishQuiz();
    return;
  }
  state.index += 1;
  saveProgress();
  Sound.swipe();
  renderQuiz('forward');
}

function finishQuiz(){
  if (state.answers.some(function(a){ return a === null; })){
    toast('还有题目没有作答');
    return;
  }
  state.result = evaluate(state.answers);
  Sound.result();
  renderResult(state.result);
  showScreen('result');
}

/* =====================================================================
 *  SHARE（Canvas 海报 / 组队卡 / 文案复制）
 * ===================================================================== */
function svgToImage(svgStr){
  return new Promise(function(resolve, reject){
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('svg load failed')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}

async function drawRoleOnCanvas(ctx, role, cx, cy, size){
  const builder = SVG_CHARS[role.svgKey];
  if (builder){
    try {
      const img = await svgToImage(builder(false));
      ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
      return;
    } catch(e){ /* 降级到 emoji */ }
  }
  const c = FALLBACK_COLORS[role.id] || ['#ffe9c4','#e9b45c'];
  const g = ctx.createRadialGradient(cx - size * 0.12, cy - size * 0.16, size * 0.04, cx, cy, size * 0.5);
  g.addColorStop(0, c[0]);
  g.addColorStop(1, c[1]);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = 'bold ' + Math.round(size * 0.4) + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5a3d12';
  ctx.fillText(role.emoji, cx, cy + size * 0.02);
  ctx.textBaseline = 'alphabetic';
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars = String(text).split('');
  let line = '';
  let lines = [];
  for (let i = 0; i < chars.length; i++){
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line !== ''){
      lines.push(line);
      line = chars[i];
      if (maxLines && lines.length >= maxLines) break;
    } else {
      line = test;
    }
  }
  if (line !== '' && (!maxLines || lines.length < maxLines)) lines.push(line);
  lines.forEach(function(l, i){
    ctx.fillText(l, x, y + i * lineHeight);
  });
  return lines.length;
}

function downloadCanvas(canvas, filename){
  function fallbackDataURL(){
    try {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('已生成图片');
    } catch(e){
      toast('图片生成失败，请直接截图保存');
    }
  }
  if (canvas.toBlob){
    canvas.toBlob(function(blob){
      if (!blob){ fallbackDataURL(); return; }
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2200);
        toast('已生成图片');
      } catch(e){ fallbackDataURL(); }
    }, 'image/png');
  } else {
    fallbackDataURL();
  }
}

async function buildPoster(res){
  const W = 750, H = 1334;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const role = res.t1.role;
  const sub = (res.composite && res.t2) ? res.t2.role : null;

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fdf9f0');
  bg.addColorStop(0.55, '#f8f0e0');
  bg.addColorStop(1, '#f0e4cf');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgba(217,164,65,0.35)';

async function buildTeamCard(res){
  const W = 750, H = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const main = res.t1.role;
  const partnerRoles = main.partners.map(function(p){ return findRoleByName(p.name); }).filter(Boolean);
  while (partnerRoles.length < 2){
    const cand = ROLES.filter(function(r){
      return r.id !== main.id && partnerRoles.indexOf(r) === -1;
    })[0];
    if (!cand) break;
    partnerRoles.push(cand);
  }
  const team = [partnerRoles[0], main, partnerRoles[1]];

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#fdf9f0');
  bg.addColorStop(1, '#efe2c9');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(217,164,65,0.16)';
  ctx.beginPath();
  ctx.arc(W / 2, 470, 320, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#c43b2f';
  ctx.font = 'bold 48px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('我 的 取 经 小 队', W / 2, 116);

  ctx.fillStyle = '#8a7d6b';
  ctx.font = '24px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('三 人 成 队 · 各 司 其 位', W / 2, 162);

  const positions = [
    { x: W * 0.2, y: 470, size: 190, role: team[0] },
    { x: W * 0.5, y: 420, size: 240, role: team[1] },
    { x: W * 0.8, y: 470, size: 190, role: team[2] }
  ];

  for (let i = 0; i < positions.length; i++){
    const p = positions[i];
    if (!p.role) continue;
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 0.56, 0, Math.PI * 2);
    ctx.fill();
    await drawRoleOnCanvas(ctx, p.role, p.x, p.y, p.size);

    ctx.fillStyle = '#2f2a26';
    ctx.font = 'bold 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(p.role.name, p.x, p.y + p.size * 0.56 + 44);

    ctx.fillStyle = '#8a7d6b';
    ctx.font = '20px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(p.role.teamSlot, p.x, p.y + p.size * 0.56 + 78);
  }

  ctx.fillStyle = '#c43b2f';
  ctx.font = 'bold 36px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('你的团队缺谁？拉他来测。', W / 2, H - 128);

  ctx.fillStyle = '#9a9188';
  ctx.font = '22px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('职场西游世界 · 取经团队人格测试', W / 2, H - 76);

  ctx.strokeStyle = 'rgba(217,164,65,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 140, H - 46);
  ctx.lineTo(W / 2 + 140, H - 46);
  ctx.stroke();

  downloadCanvas(canvas, '我的取经小队_' + main.name + '.png');
}

function copyText(text){
  return new Promise(function(resolve, reject){
    function fallback(){
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error('copy failed'));
      } catch(e){ reject(e); }
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(resolve).catch(fallback);
    } else {
      fallback();
    }
  });
}

}

function bindEvents(){
  $('#btn-start').addEventListener('click', function(){
    Sound.init();
    const answered = state.answers.filter(function(a){ return a !== null; }).length;
    if (answered === TOTAL){
      state.result = evaluate(state.answers);
      renderResult(state.result);
      showScreen('result');
      return;
    }
    if (answered === 0){

    renderQuiz(null);
    showScreen('quiz');
  });

    else showScreen('home');
  });

  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-next').addEventListener('click', goNext);

    buildPoster(state.result).catch(function(){
      const text = shareTextOf(state.result.t1.role);
      copyText(text).then(function(){ toast('海报生成失败，已为你复制分享文案'); })
        .catch(function(){ toast('海报生成失败，请截图保存结果页'); });
    });

  $('#btn-teamcard').addEventListener('click', function(){
    if (!state.result){ toast('还没有结果'); return; }

      toast('组队卡生成失败，请截图保存结果页');

  $('#sound-toggle').addEventListener('click', function(){
    Sound.on = !Sound.on;
    try { localStorage.setItem(LS_SOUND, Sound.on ? '1' : '0'); } catch(e){}
    updateSoundUI();
    if (Sound.on){
      Sound.init();
      Sound.click();
      toast('音效已开启');
    } else {
      toast('音效已关闭');
    }
  });
}

function initTitleChars(){
  const el = document.getElementById('hero-title');
  if (!el) return;
  const text = el.textContent;
  const chars = Array.from(text);
  el.innerHTML = '';
  chars.forEach(function(ch, i){
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (0.12 + i * 0.045) + 's';
    el.appendChild(span);
  });

(function init(){
  const saved = loadProgress();
  if (saved && Array.isArray(saved.answers)){
    const arr = new Array(TOTAL).fill(null);
    for (let i = 0; i < TOTAL; i++){
      const v = saved.answers[i];
      if (typeof v === 'number' && v >= 0 && v < QUESTIONS[i].options.length) arr[i] = v;
    }
    state.answers = arr;
    const idx = parseInt(saved.index, 10);
    state.index = isNaN(idx) ? 0 : clamp(idx, 0, TOTAL - 1);
  }

  initTitleChars();
  initSound();
  bindEvents();
  renderHome();
  showScreen('home');
})();
